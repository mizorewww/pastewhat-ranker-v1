initial_model: checkpoints/initial
train_data: data/frozen/pilot-train-5000.jsonl
dev_data: data/frozen/dev.jsonl
train_limit: 5000
seed: 42
device: mps
precision: bf16
max_pair_tokens: 1024
max_candidates: 20
head_warmup_steps: 200
encoder_lr: 0.00002
head_lr: 0.0001
weight_decay: 0.01
head_dropout: 0.1
micro_batch_episodes: 1
effective_batch_episodes: 16
eval_batch_episodes: 4
epochs: 2
warmup_ratio: 0.05
max_grad_norm: 1.0
gradient_checkpointing: true
length_bucket_window: 128
save_every_steps: 100
log_every_steps: 10
